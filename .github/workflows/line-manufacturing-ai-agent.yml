name: LINE 製造 AI 助理 PR 驗收

on:
  pull_request:
    paths:
      - 'smart-factory-command-center/01_GAS後端/總控_38_6_doPost最終接線.gs'
      - 'smart-factory-command-center/01_GAS後端/35_LINE_製造AI助理_ReadOnly_v0.1.gs'
      - 'smart-factory-command-center/01_GAS後端/41_LINE_製造AI助理_啟用閘門_v0.1.gs'
      - 'smart-factory-command-center/08_測試與驗收/35_LINE_製造AI助理_v0.1_驗收.gs'
      - 'gas/製造AI中央閘道_v0.1.gs'
      - '.github/workflows/line-manufacturing-ai-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 檢查必要檔案
        run: |
          test -f 'smart-factory-command-center/01_GAS後端/總控_38_6_doPost最終接線.gs'
          test -f 'smart-factory-command-center/01_GAS後端/35_LINE_製造AI助理_ReadOnly_v0.1.gs'
          test -f 'smart-factory-command-center/01_GAS後端/41_LINE_製造AI助理_啟用閘門_v0.1.gs'
          test -f 'smart-factory-command-center/08_測試與驗收/35_LINE_製造AI助理_v0.1_驗收.gs'
          test -f 'gas/製造AI中央閘道_v0.1.gs'

      - name: GAS JavaScript 語法檢查
        run: |
          for file in             'smart-factory-command-center/01_GAS後端/總控_38_6_doPost最終接線.gs'             'smart-factory-command-center/01_GAS後端/35_LINE_製造AI助理_ReadOnly_v0.1.gs'             'smart-factory-command-center/01_GAS後端/41_LINE_製造AI助理_啟用閘門_v0.1.gs'             'smart-factory-command-center/08_測試與驗收/35_LINE_製造AI助理_v0.1_驗收.gs'             'gas/製造AI中央閘道_v0.1.gs'
          do
            echo "Checking $file"
            node --check < "$file"
          done

      - name: 安全邊界檢查
        run: |
          grep -q 'LINE製造AI助理35_嘗試處理Webhook_' 'smart-factory-command-center/01_GAS後端/總控_38_6_doPost最終接線.gs'
          grep -q 'getManufacturingStatus' 'gas/製造AI中央閘道_v0.1.gs'
          grep -q 'Read Only' 'smart-factory-command-center/01_GAS後端/35_LINE_製造AI助理_ReadOnly_v0.1.gs'
          grep -q 'fail-closed' 'smart-factory-command-center/01_GAS後端/35_LINE_製造AI助理_ReadOnly_v0.1.gs'
          grep -q '驗收35_LINE製造AI助理_全部' 'smart-factory-command-center/08_測試與驗收/35_LINE_製造AI助理_v0.1_驗收.gs'
          grep -q '驗收並啟用41_LINE製造AI助理' 'smart-factory-command-center/01_GAS後端/41_LINE_製造AI助理_啟用閘門_v0.1.gs'
          grep -q "啟用: '否'" 'smart-factory-command-center/01_GAS後端/41_LINE_製造AI助理_啟用閘門_v0.1.gs'

      - name: 禁止正式寫入動作滲入 AI 助理
        run: |
          ! grep -nE '寫入報工|confirmIncomingReceipt|HOLD|正式放行|appendRow\(' 'smart-factory-command-center/01_GAS後端/35_LINE_製造AI助理_ReadOnly_v0.1.gs'
          echo 'LINE 製造 AI 助理 Read Only 邊界檢查通過'
