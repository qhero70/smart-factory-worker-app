name: Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 檢查智慧5S核心語法
        run: |
          node --check 'docs/5s/智慧5S設定.js'
          node --check 'docs/5s/智慧5S資料庫.js'
          node --check 'docs/5s/智慧5S_Google試算表直讀備援.js'
          node --check 'docs/5s/智慧5S資料修復.js'
          node --check 'docs/5s/智慧5S應用程式.js'
          node --check 'docs/5s/智慧5S_可視化標準管理.js'
          node --check 'docs/5s/智慧5S_製一組標準展開.js'
          node --check 'docs/5s/智慧5S_A5現場照片盤點.js'
          node --check 'docs/5s/智慧5S_A5首次稽核準備.js'
          node --check 'docs/5s/離線服務.js'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Disable Jekyll
        run: touch docs/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
