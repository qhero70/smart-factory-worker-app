name: Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 檢查智慧5S核心語法
        run: |
          mapfile -d '' js_files < <(find docs/5s -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          test "${#js_files[@]}" -gt 0
          for file in "${js_files[@]}"; do
            node --check "$file"
          done

          python3 -m json.tool 'docs/5s/應用程式資訊.webmanifest' >/dev/null
          test -f 'docs/5s/製一智慧5S圖示.svg'
          ! grep -R -n -E 'else初始化|else綁定|manifest truncated' \
            --include='*.js' --include='*.svg' docs/5s

          # 正式入口版本驗收：只鎖目前入口，不再用歷史1280阻擋新版部署。
          grep -q "版本: '1.3.6'" 'docs/5s/智慧5S設定.js'
          grep -q "入口版本碼: '1360'" 'docs/5s/智慧5S設定.js'
          grep -q '智慧5S_機台履歷_v1250.js?v=1360' 'docs/5s/index.html'
          grep -q '智慧5S_ISO巡檢存檔_v1330.js?v=1360' 'docs/5s/index.html'
          grep -q '智慧5S_履歷首次載入修復_v1340.js?v=1360' 'docs/5s/index.html'
          grep -q '智慧5S_可視化核心_v1280.js?v=1360' 'docs/5s/index.html'
          grep -q '智慧5S_可視化路由_v1280.js?v=1360' 'docs/5s/index.html'
          grep -q '首次開啟' 'docs/5s/智慧5S_履歷首次載入修復_v1340.js'
          grep -q '建立存檔資料' 'docs/5s/智慧5S_履歷首次載入修復_v1340.js'
          grep -q '"name":"製一｜智慧5S"' 'docs/5s/應用程式資訊.webmanifest'
          grep -q 'v=1360' 'docs/5s/應用程式資訊.webmanifest'
          grep -q '頁面=可視化&v=1360' 'docs/5s/應用程式資訊.webmanifest'
          grep -q '製一智慧5S-v1.3.6' 'docs/5s/離線服務.js'
          grep -q '智慧5S_履歷首次載入修復_v1340.js' 'docs/5s/離線服務.js'

          # LINE Bot 與 Rich Menu 正式入口不得再退回舊 v=103／105。
          node 'smart-factory-command-center/08_測試與驗收/智慧5S_LINE_v1.3.6_正式驗收.js'
          test -s 'docs/line/richmenu-supervisor-v186.png'
          test -s 'docs/line/richmenu-worker-v186.png'

          # 待回補存檔仍須保留列印入口；文件內需明確警示不是完整稽核證據。
          grep -q '查看／列印（待回補）' 'docs/5s/智慧5S_ISO巡檢存檔_v1330.js'
          grep -q '查看／列印（待回補）' 'docs/5s/智慧5S_履歷首次載入修復_v1340.js'
          grep -q '待回補預覽' 'docs/5s/智慧5S_ISO巡檢存檔_v1330.js'
          grep -q '不得視為完整稽核證據' 'docs/5s/智慧5S_ISO巡檢存檔_v1330.js'

          # A5 現場照片需完整內建，確保離線稽核仍能看見11張正式照片。
          mapfile -t a5_photos < <(find docs/5s/assets/a5 -maxdepth 1 -type f -name 'SITE-A5-*.jpg' | sort)
          test "${#a5_photos[@]}" -eq 11
          for number in $(seq -f '%03g' 8 18); do
            photo="SITE-A5-${number}.jpg"
            test -s "docs/5s/assets/a5/$photo"
            grep -q "$photo" 'docs/5s/智慧5S_A5照片內建資料_v1290.js'
            grep -q "$photo" 'docs/5s/離線服務.js'
          done

          # 既有核心結構防退版。
          grep -q '先註冊，再做任何初始化' 'docs/5s/智慧5S_可視化核心_v1280.js'
          ! grep -q 'MutationObserver' 'docs/5s/智慧5S_可視化路由_v1280.js'
          grep -q 'Roar事件按鈕' 'docs/5s/智慧5S_iPhone導航修復.js'
          grep -q 'overflow:visible!important' 'docs/5s/智慧5S_iPhone導航修復.js'
          grep -q 'MCHK-' 'docs/5s/智慧5S_機台巡檢_v1240.js'

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Disable Jekyll
        run: touch docs/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
