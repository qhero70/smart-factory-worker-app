name: Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 檢查智慧5S核心語法
        run: |
          node --check 'docs/5s/智慧5S設定.js'
          node --check 'docs/5s/智慧5S資料庫.js'
          node --check 'docs/5s/智慧5S_Google試算表直讀備援.js'
          node --check 'docs/5s/智慧5S資料修復.js'
          node --check 'docs/5s/智慧5S_登入防護.js'
          node --check 'docs/5s/智慧5S應用程式.js'
          node --check 'docs/5s/智慧5S_紅牌掃碼閉環.js'
          node --check 'docs/5s/智慧5S_紅牌列印退出修復_v1260.js'
          node --check 'docs/5s/智慧5S_紅牌結案防呆.js'
          node --check 'docs/5s/智慧5S_效能核心.js'
          node --check 'docs/5s/智慧5S_G1整理戰情.js'
          node --check 'docs/5s/智慧5S_主管戰情.js'
          node --check 'docs/5s/智慧5S_區域風險排名.js'
          node --check 'docs/5s/智慧5S_趨勢分析.js'
          node --check 'docs/5s/智慧5S_巡檢覆蓋與今日任務.js'
          node --check 'docs/5s/智慧5S_首頁精簡.js'
          node --check 'docs/5s/智慧5S_可視化標準管理.js'
          node --check 'docs/5s/智慧5S_製一組標準展開.js'
          node --check 'docs/5s/智慧5S_A5現場照片盤點.js'
          node --check 'docs/5s/智慧5S_A5首次稽核準備.js'
          node --check 'docs/5s/智慧5S_Roar事件通知.js'
          node --check 'docs/5s/智慧5S_機台巡檢_v1240.js'
          node --check 'docs/5s/智慧5S_機台履歷_v1250.js'
          node --check 'docs/5s/智慧5S_UIUX優化.js'
          node --check 'docs/5s/智慧5S_iPhone導航修復.js'
          node --check 'docs/5s/智慧5S_可視化路由修復_v1270.js'
          node --check 'docs/5s/離線服務.js'
          test -f 'docs/5s/製一智慧5S圖示.svg'
          grep -q "v=1270" 'docs/5s/index.html'
          grep -q "版本: '1.2.7'" 'docs/5s/智慧5S設定.js'
          grep -q "入口版本碼: '1270'" 'docs/5s/智慧5S設定.js'
          grep -q "機台巡檢設定: '5S_機台巡檢設定'" 'docs/5s/智慧5S設定.js'
          grep -q "const 版本 = '1.2.4'" 'docs/5s/智慧5S_Roar事件通知.js'
          grep -q "const 版本 = '1.2.4'" 'docs/5s/智慧5S_機台巡檢_v1240.js'
          grep -q "const 版本='1.2.5'" 'docs/5s/智慧5S_機台履歷_v1250.js'
          grep -q "const 版本 = '1.2.6'" 'docs/5s/智慧5S_紅牌列印退出修復_v1260.js'
          grep -q '返回智慧5S' 'docs/5s/智慧5S_紅牌列印退出修復_v1260.js'
          grep -q "\[4,'符合'\],\[3,'輕微'\],\[2,'明顯'\],\[1,'嚴重'\],\[0,'失控'\]" 'docs/5s/智慧5S_機台巡檢_v1240.js'
          grep -q 'MCHK-' 'docs/5s/智慧5S_機台巡檢_v1240.js'
          grep -q '明細編號:detailNo' 'docs/5s/智慧5S_機台巡檢_v1240.js'
          grep -q '智慧5S_機台巡檢_v1240.js?v=1270' 'docs/5s/index.html'
          grep -q '智慧5S_機台履歷_v1250.js?v=1270' 'docs/5s/index.html'
          grep -q '智慧5S_紅牌列印退出修復_v1260.js?v=1270' 'docs/5s/index.html'
          grep -q '智慧5S_可視化路由修復_v1270.js?v=1270' 'docs/5s/index.html'
          grep -q 'data-page="巡檢"' 'docs/5s/index.html'
          grep -q 'id="可視化導航"' 'docs/5s/index.html'
          grep -q "const 版本 = '1.2.7'" 'docs/5s/智慧5S_可視化路由修復_v1270.js'
          grep -q 'stopImmediatePropagation' 'docs/5s/智慧5S_可視化路由修復_v1270.js'
          grep -q "const 版本='1.2.6'" 'docs/5s/智慧5S_iPhone導航修復.js'
          grep -q "const 入口版本='1260'" 'docs/5s/智慧5S_iPhone導航修復.js'
          grep -q 'Roar事件按鈕' 'docs/5s/智慧5S_iPhone導航修復.js'
          grep -q 'overflow:visible!important' 'docs/5s/智慧5S_iPhone導航修復.js'
          grep -q "const 版本 = '1.2.3'" 'docs/5s/智慧5S_效能核心.js'
          ! grep -q 'observe(document.documentElement' 'docs/5s/智慧5S_首頁精簡.js'
          grep -q '"name":"製一｜智慧5S"' 'docs/5s/應用程式資訊.webmanifest'
          grep -q 'v=1270' 'docs/5s/應用程式資訊.webmanifest'
          grep -q '頁面=可視化&v=1270' 'docs/5s/應用程式資訊.webmanifest'
          grep -q '製一智慧5S-v1.2.7' 'docs/5s/離線服務.js'
          grep -q '智慧5S_機台履歷_v1250.js' 'docs/5s/離線服務.js'
          grep -q '智慧5S_紅牌列印退出修復_v1260.js' 'docs/5s/離線服務.js'
          grep -q '智慧5S_可視化路由修復_v1270.js' 'docs/5s/離線服務.js'

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Disable Jekyll
        run: touch docs/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
