# 觸發標記：2026-08-23 v1.2.4
name: 智慧5S v1.2.4 一次性修補

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/5s-v1240-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 修補巡檢0-4、編號、快取與入口
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'找不到修補目標：{label}')
              return text.replace(old, new, 1)

          app_path='docs/5s/智慧5S應用程式.js'
          app=read(app_path)

          old="""  function 有效區域() {
            return (狀態.資料[設定.分頁.區域主檔] || []).filter(列 => 文字(列.啟用) !== '否');
          }
          function 顯示巡檢入口() {"""
          new="""  function 有效區域() {
            return (狀態.資料[設定.分頁.區域主檔] || []).filter(列 => 文字(列.啟用) !== '否');
          }
          function 巡檢項目滿分(項目) {
            return 數值(項目 && 項目.原始資料 ? 項目.原始資料.最高分 : 5, 5);
          }
          function 產生機台巡檢檔號(區域代碼) {
            return `MCHK-${文字(區域代碼).replace(/\\s+/g,'')}`;
          }
          function 產生巡檢單號(區域代碼) {
            const d = 現在();
            const 日期碼 = `${d.getFullYear()}${補零(d.getMonth()+1)}${補零(d.getDate())}`;
            const 時間碼 = `${補零(d.getHours())}${補零(d.getMinutes())}${補零(d.getSeconds())}`;
            return `5S-CHK-${文字(區域代碼).replace(/\\s+/g,'')}-${日期碼}-${時間碼}`;
          }
          function 建立評分列HTML(資料) {
            const 最高分 = 數值(資料.最高分, 5);
            const 選項 = 最高分 === 4
              ? [[4,'符合'],[3,'輕微'],[2,'明顯'],[1,'嚴重'],[0,'失控']]
              : [[5,'符合'],[3,'輕微'],[1,'異常'],[0,'重大']];
            return `<div class=\"評分列 ${選項.length === 5 ? '五階評分' : '四階評分'}\">${選項.map(([分數,文字標籤]) => `<button class=\"評分按鈕\" type=\"button\" data-分數=\"${分數}\">${分數}<br><small>${文字標籤}</small></button>`).join('')}</div>`;
          }
          function 顯示巡檢入口() {"""
          app=rep(app,old,new,'加入巡檢編號與動態評分函式')

          old="""    狀態.目前巡檢 = { 區域, 項目, 開始時間: 完整時間字串(現在()), 備註: '' };
            顯示巡檢表單();"""
          new="""    狀態.目前巡檢 = { 區域, 項目, 機台巡檢檔號: 產生機台巡檢檔號(區域.區域代碼), 開始時間: 完整時間字串(現在()), 備註: '' };
            顯示巡檢表單();"""
          app=rep(app,old,new,'建立固定機台巡檢檔號')

          old="""<div style=\"margin-top:7px\"><span class=\"標籤\">${轉義(分類)}</span>${數值(資料.權重,1) > 1 ? `<span class=\"標籤 紅\" style=\"margin-left:6px\">重大權重 ×${數值(資料.權重,1)}</span>` : ''}</div></div></div>
                <div class=\"評分列\">
                  <button class=\"評分按鈕\" type=\"button\" data-分數=\"5\">5<br><small>符合</small></button>
                  <button class=\"評分按鈕\" type=\"button\" data-分數=\"3\">3<br><small>輕微</small></button>
                  <button class=\"評分按鈕\" type=\"button\" data-分數=\"1\">1<br><small>異常</small></button>
                  <button class=\"評分按鈕\" type=\"button\" data-分數=\"0\">0<br><small>重大</small></button>
                </div>"""
          new="""<div style=\"margin-top:7px\"><span class=\"標籤\">${轉義(分類)}</span><span class=\"標籤 藍\" style=\"margin-left:6px\">${轉義(資料.項目代碼)}</span>${數值(資料.權重,1) > 1 ? `<span class=\"標籤 紅\" style=\"margin-left:6px\">重大權重 ×${數值(資料.權重,1)}</span>` : ''}</div></div></div>
                ${建立評分列HTML(資料)}"""
          app=rep(app,old,new,'4/3/2/1/0動態評分按鈕與項目代碼')

          old="""<div class=\"巡檢進度列\"><div><b>${轉義(巡檢.區域.區域名稱)}</b><div class=\"卡片副標\">${轉義(巡檢.區域.檢查清單代碼)}</div></div><b id=\"巡檢進度文字\">0 / ${巡檢.項目.length}</b></div>"""
          new="""<div class=\"巡檢進度列\"><div><b>${轉義(巡檢.區域.區域名稱)}</b><div class=\"卡片副標\">${轉義(巡檢.機台巡檢檔號)}｜${轉義(巡檢.區域.檢查清單代碼)}</div></div><b id=\"巡檢進度文字\">0 / ${巡檢.項目.length}</b></div>"""
          app=rep(app,old,new,'巡檢頁顯示機台檔號')

          app=rep(app,"const 異常 = 分數 < 5;","const 異常 = 分數 < 巡檢項目滿分(項目);",'評分異常門檻')
          app=rep(app,"const 未填原因 = 巡檢.項目.findIndex(項目 => 項目.分數 < 5 && !文字(項目.異常原因));","const 未填原因 = 巡檢.項目.findIndex(項目 => 項目.分數 < 巡檢項目滿分(項目) && !文字(項目.異常原因));",'異常原因門檻')
          app=rep(app,"const 未拍照 = 巡檢.項目.findIndex(項目 => 項目.分數 < 5 && !項目.照片資料);","const 未拍照 = 巡檢.項目.findIndex(項目 => 項目.分數 < 巡檢項目滿分(項目) && !項目.照片資料);",'異常照片門檻')
          app=rep(app,"const 巡檢單號 = 產生識別碼('5S-INS');","const 巡檢單號 = 產生巡檢單號(巡檢.區域.區域代碼);",'正式巡檢單號')
          app=rep(app,"if (項目.分數 < 5) 異常項數 += 1;","if (項目.分數 < 巡檢項目滿分(項目)) 異常項數 += 1;",'異常項數門檻')
          app=rep(app,"巡檢.項目.forEach(項目 => {\n      const 是否異常 = 項目.分數 < 5;","巡檢.項目.forEach((項目, 項目索引) => {\n      const 是否異常 = 項目.分數 < 巡檢項目滿分(項目);",'明細逐項異常門檻')
          app=rep(app,"const 明細編號 = 產生識別碼('5S-DTL');","const 明細編號 = `${巡檢單號}-${補零(項目索引 + 1)}`;",'固定01-20明細編號')
          app=rep(app,"const 嚴重度 = 項目.分數 === 0 ? '高' : (項目.分數 === 1 ? '中' : '低');","const 嚴重度 = 項目.分數 <= 1 ? '高' : (項目.分數 === 2 ? '中' : '低');",'0-4嚴重度')
          app=rep(app,"來源類型: '巡檢異常', 來源單號: 巡檢單號,","來源類型: '巡檢異常', 來源單號: 明細編號,",'改善單精確關聯明細')
          app=rep(app,"navigator.serviceWorker.register('./離線服務.js?v=102', { scope: './' })","navigator.serviceWorker.register('./離線服務.js?v=1240', { scope: './' })",'Service Worker版本')
          write(app_path, app)

          css_path='docs/5s/智慧5S_UIUX優化.css'
          css=read(css_path)
          marker='/* v1.2.4｜0-4巡檢五階評分 */'
          if marker not in css:
              css += """

          /* v1.2.4｜0-4巡檢五階評分 */
          .評分列.五階評分{grid-template-columns:repeat(5,minmax(0,1fr))!important}
          .評分列.五階評分 .評分按鈕{padding:8px 2px;min-width:0}
          .評分按鈕[data-分數=\"4\"].已選{background:var(--成功)!important;color:#fff!important}
          .評分按鈕[data-分數=\"3\"].已選{background:var(--資訊)!important;color:#fff!important}
          .評分按鈕[data-分數=\"2\"].已選{background:#d99018!important;color:#fff!important}
          .評分按鈕[data-分數=\"1\"].已選{background:#b94a48!important;color:#fff!important}
          .評分按鈕[data-分數=\"0\"].已選{background:var(--危險)!important;color:#fff!important}
          @media(max-width:390px){.評分列.五階評分{gap:5px}.評分列.五階評分 .評分按鈕{font-size:.86rem}.評分列.五階評分 small{font-size:.6rem}}
          """
          write(css_path, css)

          index_path='docs/5s/index.html'
          index=read(index_path)
          index=index.replace('v=1230','v=1240')
          index=index.replace('id=\"登入版本\">1.2.3','id=\"登入版本\">1.2.4')
          write(index_path,index)

          pages_path='.github/workflows/pages.yml'
          pages=read(pages_path)
          pages=pages.replace('grep -q \"v=1230\" \'docs/5s/index.html\'','grep -q \"v=1240\" \'docs/5s/index.html\'')
          anchor="          grep -q '\"name\":\"製一｜智慧5S\"' 'docs/5s/應用程式資訊.webmanifest'\n"
          extra="""          grep -q \"版本: '1.2.4'\" 'docs/5s/智慧5S設定.js'
          grep -q \"入口版本碼: '1240'\" 'docs/5s/智慧5S設定.js'
          grep -q \"機台巡檢設定: '5S_機台巡檢設定'\" 'docs/5s/智慧5S設定.js'
          grep -q \"const 版本 = '1.2.4'\" 'docs/5s/智慧5S_Roar事件通知.js'
          grep -q \"data-分數=\\\"4\\\"\" 'docs/5s/智慧5S應用程式.js'
          grep -q \"產生巡檢單號\" 'docs/5s/智慧5S應用程式.js'
          grep -q \"巡檢單號-\" 'docs/5s/智慧5S_UIUX優化.css' || true
"""
          if "版本: '1.2.4'" not in pages:
              if anchor not in pages:
                  raise SystemExit('找不到Pages驗證插入點')
              pages=pages.replace(anchor,extra+anchor)
          write(pages_path,pages)
          PY

      - name: 語法與版本驗收
        run: |
          node --check 'docs/5s/智慧5S應用程式.js'
          node --check 'docs/5s/智慧5S_Roar事件通知.js'
          node --check 'docs/5s/智慧5S設定.js'
          node --check 'docs/5s/離線服務.js'
          grep -q 'data-分數="4"' 'docs/5s/智慧5S應用程式.js'
          grep -q 'data-分數="2"' 'docs/5s/智慧5S應用程式.js'
          grep -q 'MCHK-' 'docs/5s/智慧5S應用程式.js'
          grep -q 'v=1240' 'docs/5s/index.html'
          ! grep -q "離線服務.js?v=102" 'docs/5s/智慧5S應用程式.js'

      - name: 提交正式修補
        run: |
          git config user.name '智慧5S自動修補'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/5s .github/workflows/pages.yml
          git commit -m 'fix(5S): v1.2.4通知中心與機台20項0-4正式建檔' || exit 0
          git push origin HEAD:main
