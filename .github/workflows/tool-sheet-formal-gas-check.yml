name: 刀具表正式GAS唯讀檢查
on:
  push:
    branches: [main]
    paths:
      - 'docs/tool-change-pwa/**'
      - 'smart-factory-command-center/01_GAS後端/刀具表正式資料連線.gs'
      - 'smart-factory-command-center/01_GAS後端/75_LINE_製造工具中心_v1.0.gs'
      - '.github/workflows/tool-sheet-formal-gas-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 唯讀核對正式刀具表專用API與JSONP
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          base='https://script.google.com/macros/s/AKfycbzFuaDkPpXRxNltlU2IL7N2iGnFKDIbBvWlUX0dxJCo7IyMSZGD4DrUoXgvWiYczKCX/exec'
          for api in ['刀具表_狀態','刀具表_清單']:
              callback='__toolSheetReadOnlyCheck'
              url=base+'?'+urllib.parse.urlencode({'api':api,'callback':callback})
              with urllib.request.urlopen(url,timeout=90) as response:
                  body=response.read().decode('utf-8-sig').strip()
                  status=response.status
              prefix=callback+'('
              if not body.startswith(prefix) or not body.endswith(');'):
                  raise SystemExit('FAIL: 正式端點未回傳指定JSONP；不輸出HTML或敏感原文')
              data=json.loads(body[len(prefix):-2])
              if status!=200 or data.get('成功') is not True or data.get('版本')!='2.2.7' or data.get('主庫ID')!='19osmTlQQ9obDmVvmv5uphFHRwCtd2pkFhe6p3pYMSn8':
                  raise SystemExit('FAIL: 正式回應旗標／版本／主庫識別不符')
              print(api+': PASS；版本='+data['版本']+'；筆數='+str(len(data.get('資料',[]))))
